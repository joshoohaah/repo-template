# Prepares the environment for the GitHub Copilot cloud agent before it starts
# work on an issue, so it can run `bash scripts/verify.sh` like everyone else.
# The job MUST be named `copilot-setup-steps`.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Keep these in step with .github/workflows/ci.yml.
