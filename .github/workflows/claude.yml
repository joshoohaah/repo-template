# Mention @claude in an issue, PR comment, or review to have Claude Code work on it.
#
# One-time setup (pick one), as a repo or org secret:
#   CLAUDE_CODE_OAUTH_TOKEN — run `claude setup-token` (uses your Claude subscription)
#   ANTHROPIC_API_KEY       — API key; then swap the input below
# Also install the Claude GitHub app: run `/install-github-app` in Claude Code.
#
# Docs: https://code.claude.com/docs/en/github-actions
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when someone with write access mentions @claude.
    if: |
      (contains(github.event.comment.body, '@claude') ||
       contains(github.event.review.body, '@claude') ||
       contains(github.event.issue.body, '@claude')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.review.author_association ||
        github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Install the same toolchain as ci.yml so Claude can run scripts/verify.sh.

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
